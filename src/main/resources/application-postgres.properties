# ===================================================================
# PostgreSQL Configuration Profile for Book Sharing Application
# Activate with: -Dspring.profiles.active=postgres
# or environment variable: SPRING_PROFILES_ACTIVE=postgres
# ===================================================================

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookshare_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization: runs data.sql against PostgreSQL on startup
spring.sql.init.mode=${SQL_INIT_MODE:always}

