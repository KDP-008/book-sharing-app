# Spring Boot application properties

# Server config
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database config
# Default: H2 in-memory for local development and testing.
# Override with environment variables for database of your choice.
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookshare_db}
spring.datasource.driverClassName=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA + Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console only when using H2
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Ensure SQL initialization does NOT run by default. Use the 'dev' profile to load sample data.
# This prevents sample data from interfering with tests and production runs.
spring.sql.init.mode=never