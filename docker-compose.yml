version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-sharing-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:h2:mem:bookshare_db
      DB_DRIVER_CLASS_NAME: org.h2.Driver
      DB_USERNAME: sa
      DB_PASSWORD: ""
      DB_DIALECT: org.hibernate.dialect.H2Dialect
      DB_DDL_AUTO: update
    restart: unless-stopped
